[theme]
base = "light"
primaryColor = "#16A36A"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6F8"
textColor = "#202631"
linkColor = "#16845A"
borderColor = "#E1E5E9"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "12px"
buttonRadius = "10px"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
baseFontSize = 15
headingFontSizes = ["38px", "26px", "21px", "17px", "15px", "13px"]
headingFontWeights = [700, 700, 700, 600, 600, 600]
chartCategoricalColors = ["#16A36A", "#FF6262", "#4E7BD9", "#F4B740", "#7D8794", "#8B67C8"]
chartSequentialColors = ["#EAF7F1", "#D2EFE2", "#B6E5D1", "#8ED5B9", "#64C39D", "#3DB281", "#16A36A", "#128A5A", "#0D7049", "#09583A"]
dataframeBorderColor = "#E1E5E9"
dataframeHeaderBackgroundColor = "#F4F6F8"

[theme.sidebar]
backgroundColor = "#202B3C"
secondaryBackgroundColor = "#303C4F"
textColor = "#F7F9FB"
primaryColor = "#38C98B"
borderColor = "#3B485B"

[server]
headless = true

[browser]
gatherUsageStats = false
