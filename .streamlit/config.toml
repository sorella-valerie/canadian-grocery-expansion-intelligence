[theme]
base = "light"
primaryColor = "#C65310"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F7F8"
textColor = "#141D29"
linkColor = "#153A47"
borderColor = "#DCE3E6"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "12px"
buttonRadius = "10px"
font = "'Roboto':https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;900&display=swap"
headingFont = "'Roboto':https://fonts.googleapis.com/css2?family=Roboto:wght@700;900&display=swap"
baseFontSize = 15
headingFontSizes = ["38px", "26px", "21px", "17px", "15px", "13px"]
headingFontWeights = [700, 700, 700, 600, 600, 600]
chartCategoricalColors = ["#C65310", "#153A47", "#5F8792", "#D99A68", "#78909C", "#AABBC1"]
chartSequentialColors = ["#F7EEE8", "#F2DCCE", "#EBC7B0", "#E2AD8A", "#D88F61", "#CE7137", "#C65310", "#A9470E", "#87390B", "#672B08"]
dataframeBorderColor = "#E1E5E9"
dataframeHeaderBackgroundColor = "#F4F6F8"

[theme.sidebar]
backgroundColor = "#153A47"
secondaryBackgroundColor = "#214B59"
textColor = "#F7F9FB"
primaryColor = "#E26C22"
borderColor = "#315866"

[server]
headless = true

[browser]
gatherUsageStats = false
